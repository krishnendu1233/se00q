name: Process Videos to 360p & PNG

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write # Required  for the bot to push the new files back to your repo

jobs:
  process-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install moviepy

      - name: Run Processing Script
        run: |
          cat << 'EOF' > process_media.py
          import os
          from moviepy.editor import VideoFileClip

          DIRECTORY = "public" # Update if your videos are in public/videos

          if os.path.exists(DIRECTORY):
              for filename in os.listdir(DIRECTORY):
                  if filename.lower().endswith(".mp4"):
                      filepath = os.path.join(DIRECTORY, filename)
                      base_name = os.path.splitext(filename)[0]
                      png_filepath = os.path.join(DIRECTORY, f"{base_name}.png")
                      temp_filepath = os.path.join(DIRECTORY, f"{base_name}_temp.mp4")

                      try:
                          print(f"Processing {filename}...")
                          clip = VideoFileClip(filepath)
                          
                          # Extract frame at 4s (or 0.5s before end if shorter)
                          frame_time = min(4.0, max(0, clip.duration - 0.5))
                          clip.save_frame(png_filepath, t=frame_time)
                          
                          # Resize to 360p
                          resized_clip = clip.resize(height=640) 
                          resized_clip.write_videofile(
                              temp_filepath, 
                              codec="libx264", 
                              audio_codec="aac", 
                              logger=None
                          )
                          
                          clip.close()
                          resized_clip.close()
                          
                          # Replace old video
                          os.replace(temp_filepath, filepath)
                      except Exception as e:
                          print(f"Error processing {filename}: {e}")
                          if os.path.exists(temp_filepath):
                              os.remove(temp_filepath)
          EOF
          python process_media.py
          rm process_media.py # Clean up the script so it isn't committed

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          
          # Only commit if changes were actually made
          if ! git diff --cached --quiet; then
            git commit -m "chore: compress videos to 360p and extract PNG frames"
            git push
          else
            echo "No videos needed processing."
          fi
